<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 420" fill="none" role="img" aria-hidden="true">
  <defs>
    <linearGradient id="plane" x1="40" y1="40" x2="440" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7a9bc4" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#1e3a5f" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#c5d4e8" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#7a9bc4" stop-opacity="0.35"/>
    </linearGradient>
  </defs>
  <!-- atmospheric discs -->
  <circle cx="360" cy="90" r="78" fill="#7a9bc4" fill-opacity="0.08"/>
  <circle cx="110" cy="320" r="96" fill="#3b5b8a" fill-opacity="0.1"/>
  <!-- back plane -->
  <rect x="72" y="58" width="336" height="220" rx="18" fill="url(#plane)" stroke="url(#edge)" stroke-width="1.5"/>
  <!-- mid plane -->
  <rect x="96" y="98" width="288" height="188" rx="14" fill="#0f1720" fill-opacity="0.35" stroke="#7a9bc4" stroke-opacity="0.45" stroke-width="1.25"/>
  <!-- front plane -->
  <rect x="120" y="138" width="240" height="156" rx="12" fill="#0b1220" fill-opacity="0.55" stroke="#c5d4e8" stroke-opacity="0.55" stroke-width="1.25"/>
  <!-- API core -->
  <rect x="168" y="178" width="144" height="52" rx="10" fill="#3b5b8a" fill-opacity="0.85"/>
  <text x="240" y="210" text-anchor="middle" font-family="IBM Plex Sans, ui-sans-serif, sans-serif" font-size="18" font-weight="600" fill="#f4f7fb">Public API</text>
  <!-- satellites -->
  <g font-family="IBM Plex Sans, ui-sans-serif, sans-serif" font-size="13" font-weight="500" fill="#c5d4e8">
    <rect x="40" y="168" width="88" height="36" rx="8" fill="#1a2838" stroke="#7a9bc4" stroke-opacity="0.5"/>
    <text x="84" y="191" text-anchor="middle">MCP</text>
    <rect x="352" y="168" width="88" height="36" rx="8" fill="#1a2838" stroke="#7a9bc4" stroke-opacity="0.5"/>
    <text x="396" y="191" text-anchor="middle">OAuth</text>
    <rect x="78" y="300" width="96" height="36" rx="8" fill="#1a2838" stroke="#7a9bc4" stroke-opacity="0.5"/>
    <text x="126" y="323" text-anchor="middle">Plugin</text>
    <rect x="192" y="320" width="96" height="36" rx="8" fill="#1a2838" stroke="#7a9bc4" stroke-opacity="0.5"/>
    <text x="240" y="343" text-anchor="middle">Docker STF</text>
    <rect x="306" y="300" width="96" height="36" rx="8" fill="#1a2838" stroke="#7a9bc4" stroke-opacity="0.5"/>
    <text x="354" y="323" text-anchor="middle">Custom FE</text>
  </g>
  <!-- connectors -->
  <g stroke="#7a9bc4" stroke-opacity="0.55" stroke-width="1.25">
    <path d="M128 186 H168"/>
    <path d="M312 186 H352"/>
    <path d="M210 230 V300"/>
    <path d="M240 230 V320"/>
    <path d="M270 230 V300"/>
  </g>
</svg>
